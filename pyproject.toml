[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-forge-prototype"
version = "0.1.0"
description = "A research prototype for compiling scientific datasets into validated JEPA-style tasks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "torch>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["reportlab>=4", "pypdf>=5"]

[project.scripts]
jepa-forge = "jepa_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

