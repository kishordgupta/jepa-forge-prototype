name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=5' pillow
      - run: python scripts/install_security_tools.py
      - run: python scripts/check_privacy.py
      - run: python scripts/check_privacy.py --history
      - run: artifacts/security-tools/gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts='--branches --tags --remotes --full-history' .
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[dev]'
      - run: pytest -q
      - run: jepa-forge inspect wine
